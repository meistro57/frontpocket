openapi: 3.1.0
info:
  title: FrontPocket API
  version: 0.1.0
  description: Source-backed memory retrieval API for FrontPocket.
servers:
  - url: http://localhost:8088
paths:
  /health:
    get:
      operationId: getHealth
      summary: Health status
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  qdrant:
                    type: string
                  redis:
                    type: string
                  version:
                    type: string
  /openapi.json:
    get:
      operationId: getOpenAPISchema
      summary: Fetch OpenAPI schema
      responses:
        '200':
          description: OpenAPI schema
  /memory/stats:
    get:
      operationId: getMemoryStats
      summary: Get aggregated memory stats
      parameters:
        - in: query
          name: project
          required: false
          schema:
            type: string
        - in: query
          name: memory_kind
          required: false
          schema:
            type: string
        - in: query
          name: speaker
          required: false
          schema:
            type: string
        - in: query
          name: source_type
          required: false
          schema:
            type: string
        - in: query
          name: conversation_id
          required: false
          schema:
            type: string
        - in: query
          name: tags
          required: false
          schema:
            type: string
            description: Comma-separated tags.
      responses:
        '200':
          description: Aggregated memory statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  by_kind:
                    type: object
                    additionalProperties:
                      type: integer
                  by_speaker:
                    type: object
                    additionalProperties:
                      type: integer
                  by_project:
                    type: object
                    additionalProperties:
                      type: integer
  /memory/session:
    post:
      operationId: upsertOrLoadSessionState
      summary: Create, update, or load session state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id:
                  type: string
                project:
                  type: string
                active_summary:
                  type: string
                recent_memory_ids:
                  type: array
                  items:
                    type: string
                metadata:
                  type: object
                  additionalProperties:
                    type: string
                ttl_seconds:
                  type: integer
                  minimum: 1
                load_only:
                  type: boolean
      responses:
        '200':
          description: Session state response
          content:
            application/json:
              schema:
                type: object
                properties:
                  found:
                    type: boolean
                  state:
                    type: object
                    properties:
                      session_id:
                        type: string
                      project:
                        type: string
                      active_summary:
                        type: string
                      recent_memory_ids:
                        type: array
                        items:
                          type: string
                      metadata:
                        type: object
                        additionalProperties:
                          type: string
                      updated_at:
                        type: string
                        format: date-time
  /memory/search:
    post:
      operationId: searchMemory
      summary: Search memory records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                limit:
                  type: integer
                  minimum: 1
                  maximum: 20
      responses:
        '200':
          description: Search results
  /memory/context-pack:
    post:
      operationId: buildContextPack
      summary: Build a context pack from query and filters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                limit:
                  type: integer
                  minimum: 1
                  maximum: 20
      responses:
        '200':
          description: Context pack response
