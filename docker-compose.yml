services:
  frontpocket-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frontpocket-api
    env_file:
      - .env
    environment:
      QDRANT_URL: ${DOCKER_QDRANT_URL:-http://qdrant:6333}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379/0}
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://ollama:11434}
    ports:
      - "8088:8088"
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8088/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: frontpocket-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  redis:
    image: redis:7.4-alpine
    container_name: frontpocket-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.9.6
    container_name: frontpocket-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  qdrant_storage:
  redis_data:
  ollama_data:
